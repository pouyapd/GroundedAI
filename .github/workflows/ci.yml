name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install (no model downloads)
        run: |
          pip install -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check groundedai tests
          ruff format --check groundedai tests
          ruff check --config pyproject.toml ../scripts ../tools ../evaluation/scripts
          ruff format --config pyproject.toml --check ../scripts ../tools ../evaluation/scripts
      - name: Type check
        run: mypy
      - name: Tests (SQLite, deterministic providers, offline)
        run: pytest --cov --cov-report=term-missing:skip-covered

  postgres:
    name: Backend on PostgreSQL + pgvector
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: groundedai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: groundedai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundedai -d groundedai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      GROUNDEDAI_TEST_POSTGRES_URL: postgresql+psycopg://groundedai:ci-only-password@localhost:5432/groundedai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: |
          pip install -r requirements/dev.txt
          pip install --no-deps -e .
      - name: PostgreSQL integration tests
        run: pytest -m postgres -rs

  evaluation:
    name: Offline retrieval benchmark (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: |
          pip install -r backend/requirements/dev.txt
          pip install --no-deps -e backend
      - name: Dataset integrity and offline benchmark
        run: groundedai eval retrieval --config evaluation/configs/retrieval_offline.json --out evaluation/reports/local
      - uses: actions/upload-artifact@v7
        with:
          name: offline-benchmark-report
          path: evaluation/reports/local/

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (runtime + ML locks)
        run: |
          pip install pip-audit==2.10.1
          # Audits the pinned versions directly (nothing is installed). The CPU-only
          # torch wheel is not on PyPI and is reported as skipped.
          pip-audit --no-deps --disable-pip -r backend/requirements/prod.txt
          pip-audit --no-deps --disable-pip -r backend/requirements/ml.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image and Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: groundedai:ci
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Smoke-test the container (SQLite, demo providers)
        run: |
          docker run -d --name groundedai -p 8000:8000 -e GROUNDEDAI_DATABASE_URL=sqlite:////data/ci.db groundedai:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/system/status
          curl -fsS http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          docker logs groundedai | tail -20
