name: Live demo (GitHub Pages)

# Builds the online demo: the React UI plus GroundedAI's own Python package, which runs in the
# visitor's browser (Pyodide). The pinned wheels come from frontend/browser-runtime.lock.json;
# the optional language model (WebLLM) is downloaded by the visitor's browser, not here.
# The built site is checked in a browser before it is deployed, and the deployed URL afterwards.
# Enable it in the repository settings: Pages -> Source -> GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/groundedai/**"
      - "examples/**"
      - "scripts/build_browser_runtime.py"
      - "scripts/e2e_demo.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Free GitHub plans serve Pages only from public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python runtime for the browser (pinned wheels, checked hashes)
        run: python scripts/build_browser_runtime.py build
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:browser
      - name: Check the built demo in Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python scripts/e2e_demo.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the deployed demo in Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python scripts/e2e_demo.py --url "${{ needs.deploy.outputs.page_url }}"
