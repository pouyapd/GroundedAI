# Alembic configuration for command-line use (run from the backend/ directory):
#   alembic upgrade head
# The database URL and embedding dimension come from the application settings
# (GROUNDEDAI_DATABASE_URL, GROUNDEDAI_EMBEDDING_DIM). The app also applies
# migrations automatically at startup unless GROUNDEDAI_AUTO_MIGRATE=false.

[alembic]
script_location = groundedai/persistence/migrations
